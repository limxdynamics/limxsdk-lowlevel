# 放进 limxsdk-lowlevel 仓库的 .github/workflows/publish.yml
#
# 触发：推送 v* tag（或手动 workflow_dispatch）。
# 认证：PyPI Trusted Publishing（OIDC），仓库里不存任何 token/secret。
#
# 与「标准源码构建型」模板的三处关键差异 —— 不要改回去：
#   1. 没有 `python -m build`：wheel 由内部流水线交叉编译后 commit 进仓库，
#      CI 上既没有 C++ 源码也编不出三平台产物。
#   2. 版本校验不 grep pyproject.toml（仓库里没有 pyproject.toml），改为
#      解包读 wheel 的 METADATA，与文件名版本号互校。
#   3. **一个 tag 可以同时发布多个版本号**：dist/ 里既是 4.1.0（三平台）
#      又是 4.1.1（Linux 两平台），gh-action 会逐文件上传，PyPI 自动分建
#      release。配 skip-existing 后，后续补传同一版本的其他平台文件也不会报错。

name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    name: Collect and verify wheels
    runs-on: ubuntu-latest
    if: github.repository == 'limxdynamics/limxsdk-lowlevel'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Collect prebuilt wheels
        run: |
          set -euo pipefail
          mkdir -p dist
          find python3 -name '*.whl' -not -path '*/build/*' -exec cp -v {} dist/ \;
          echo "collected: $(ls -1 dist/*.whl | wc -l) wheel(s)"

      - name: Verify metadata and report per-version coverage
        run: |
          python -m pip install --quiet --upgrade pip packaging
          python - <<'PY'
          import collections, glob, os, re, sys, zipfile
          from packaging.utils import parse_wheel_filename

          wheels = sorted(glob.glob("dist/*.whl"))
          if not wheels:
              sys.exit("no wheels collected from python3/")

          groups = collections.defaultdict(list)
          errors = []

          for path in wheels:
              fname = os.path.basename(path)
              try:
                  _, ver, _, tags = parse_wheel_filename(fname)
              except Exception as exc:
                  errors.append(f"{fname}: unparsable wheel filename ({exc})")
                  continue

              with zipfile.ZipFile(path) as zf:
                  metas = [n for n in zf.namelist() if n.endswith(".dist-info/METADATA")]
                  if len(metas) != 1:
                      errors.append(f"{fname}: expected 1 METADATA, found {len(metas)}")
                      continue
                  meta_ver = ""
                  for line in zf.read(metas[0]).decode("utf-8").splitlines():
                      if not line.strip():
                          break
                      if line.startswith("Version:"):
                          meta_ver = line.split(":", 1)[1].strip()

              if meta_ver != str(ver):
                  errors.append(f"{fname}: filename says {ver}, METADATA says {meta_ver!r}")

              groups[str(ver)].append((fname, " ".join(sorted(str(t) for t in tags))))

          print(f"{'version':10s} {'platform tags':52s} file")
          print("-" * 110)
          for ver in sorted(groups):
              for fname, tagstr in groups[ver]:
                  print(f"{ver:10s} {tagstr:52s} {fname}")

          for ver, items in groups.items():
              counter = collections.Counter(t for _, t in items)
              for tagstr, n in counter.items():
                  if n > 1:
                      errors.append(f"version {ver}: duplicate platform tag {tagstr} ({n} files)")

          ref = os.environ.get("GITHUB_REF_NAME", "")
          match = re.fullmatch(r"v(\d+\.\d+\.\d+)", ref)
          if match and match.group(1) not in groups:
              errors.append(f"tag {ref} matches none of the collected versions: {sorted(groups)}")

          if errors:
              for err in errors:
                  print(f"::error::{err}")
              sys.exit("wheel verification failed")
          PY

      - name: twine check
        run: |
          python -m pip install --quiet --upgrade twine
          python -m twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*.whl

  publish:
    name: Upload to PyPI
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          print-hash: true
